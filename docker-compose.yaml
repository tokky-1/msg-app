services:
  db:
    image: postgres:15
    # No env_file here on purpose. backend/.env holds SECRET_KEY and the rest
    # of the app's config, and Postgres needs none of it — handing it over
    # would put the JWT signing key inside the database container for nothing.
    environment:
      # ${...} is interpolated from compose's own env file, so run compose
      # with: --env-file ./backend/.env
      - POSTGRES_USER=${DB_USER:?set DB_USER - run compose with --env-file ./backend/.env}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD - run compose with --env-file ./backend/.env}
      - POSTGRES_DB=${DB_NAME:?set DB_NAME - run compose with --env-file ./backend/.env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
